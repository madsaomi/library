{% load static %}{% load i18n %}
<!DOCTYPE html>
<html lang="{{ LANGUAGE_CODE }}">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% trans "Parol tiklandi | Online Kutubxona" %}</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}?v=20260806">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card-premium">
            <div class="text-center">
                <div class="error-icon-badge" style="border-color: rgba(34, 197, 94, 0.3);">
                    <i class="fas fa-check-circle text-success"></i>
                </div>
                <h1 class="text-primary text-2xl mb-md">{% trans "Parol muvaffaqiyatli tiklandi!" %}</h1>
                <p class="text-muted text-sm mb-xl">{% trans "Endi yangi parolingiz bilan tizimga kirishingiz mumkin." %}</p>
                <a href="{% url 'login' %}" class="btn-primary d-inline-block py-md px-xl font-weight-bold text-decoration-none shadow-sm" style="border-radius: 12px;">{% trans "Kirish" %} <i class="fas fa-arrow-right ml-xs"></i></a>
            </div>
        </div>
    </div>
</body>
</html>
