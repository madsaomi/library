{% load static %}{% load i18n %}
<!DOCTYPE html>
<html lang="{{ LANGUAGE_CODE }}">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% trans "Yangi parol | Online Kutubxona" %}</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}?v=20260806">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-bg-layer"></div>
        <div class="bg-orb bg-orb-1"></div>
        <div class="bg-orb bg-orb-2"></div>
        <div class="auth-overlay"></div>
        <div class="auth-card-premium">
            <div class="text-center mb-2xl">
                <div class="d-inline-flex flex-center rounded-xl mb-md p-sm" style="width: 56px; height: 56px; background: var(--glass-strong); border: 1px solid var(--border);">
                    <i class="fas fa-lock text-primary" style="font-size: 1.8rem;"></i>
                </div>
                <h1 class="gradient-text text-2xl mb-sm">{% trans "Yangi parol" %}</h1>
            </div>
            {% if validlink %}
            <form method="post">{% csrf_token %}
                <div class="form-group mb-md">
                    <label for="id_new_password1" class="text-muted text-sm mb-xs d-block">{% trans "Yangi parol" %}</label>
                    <input type="password" name="new_password1" id="id_new_password1" class="form-control" required>
                </div>
                <div class="form-group mb-xl">
                    <label for="id_new_password2" class="text-muted text-sm mb-xs d-block">{% trans "Yangi parolni takrorlang" %}</label>
                    <input type="password" name="new_password2" id="id_new_password2" class="form-control" required>
                </div>
                <button type="submit" class="btn-primary w-full py-md font-weight-bold transition shadow-sm" style="border-radius: 12px;">{% trans "Saqlash" %} <i class="fas fa-check ml-xs"></i></button>
            </form>
            {% else %}
            <p class="text-muted text-sm text-center mb-xl">{% trans "Parolni tiklash havolasi yaroqsiz. Iltimos, qaytadan urinib ko'ring." %}</p>
            <div class="text-center mt-xl">
                <a href="{% url 'password_reset' %}" class="text-primary text-sm text-decoration-none">{% trans "Qaytadan urinish" %}</a>
            </div>
            {% endif %}
        </div>
    </div>
</body>
</html>
