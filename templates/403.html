{% load static %}
{% load i18n %}
{% get_current_language as LANGUAGE_CODE %}
<!DOCTYPE html>
<html lang="{{ LANGUAGE_CODE }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>403 - {% trans "Ruxsat etilmagan" %}</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}?v=20260806">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="overflow-hidden">
    <div class="error-viewport">

        <!-- Theme Toggle Button -->
        <button class="pos-fixed bg-hover border text-muted rounded-md cursor-pointer d-flex flex-center transition shadow-sm" onclick="cycleTheme()" style="top: 20px; right: 20px; z-index: 999; width: 45px; height: 45px; backdrop-filter: blur(14px); border-radius: 14px;">
            <i id="themeIcon" class="fas fa-moon"></i>
        </button>

        <!-- Error Card -->
        <div class="error-card-premium text-center" style="border-color: rgba(245, 158, 11, 0.25);">
            <div class="error-icon-badge" style="border-color: rgba(245, 158, 11, 0.3);">
                <i class="fas fa-user-shield text-warning" style="color: #f59e0b !important;"></i>
            </div>
            <h1 class="text-primary text-3xl mb-md">403</h1>
            <h2 class="text-xl mb-md font-weight-bold">{% trans "Sizda ushbu sahifaga kirish huquqi yo'q" %}</h2>
            <p class="text-muted text-sm mb-2xl lh-normal">{% trans "Ushbu sahifaga kirish taqiqlangan yoki yetarli huquqlarga ega emassiz." %}</p>
            <a href="/" class="btn-primary text-decoration-none d-inline-flex align-center gap-2 py-md px-2xl font-weight-bold shadow-sm">
                <i class="fas fa-home"></i> {% trans "Bosh sahifaga qaytish" %}
            </a>
        </div>
    </div>

    <!-- Theme & Background Logic -->
    <script>
        function cycleTheme() {
            const html = document.documentElement;
            const current = html.getAttribute('data-theme') || 'dark';
            const themes = ['dark', 'light'];
            const idx = themes.indexOf(current);
            const next = themes[(idx + 1) % themes.length];
            html.setAttribute('data-theme', next);
            localStorage.setItem('theme', next);
            updateThemeIcon();
        }

        function updateThemeIcon() {
            const icon = document.getElementById('themeIcon');
            if (!icon) return;
            const theme = document.documentElement.getAttribute('data-theme') || 'dark';
            const icons = { 'dark': 'fa-moon', 'light': 'fa-sun' };
            icon.className = 'fas ' + (icons[theme] || 'fa-moon');
        }

        (function() {
            const saved = localStorage.getItem('theme');
            const themes = ['dark', 'light'];
            if (saved && themes.includes(saved)) {
                document.documentElement.setAttribute('data-theme', saved);
            } else {
                const prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches;
                document.documentElement.setAttribute('data-theme', prefersLight ? 'light' : 'dark');
            }
            updateThemeIcon();
        })();
</script>
</body>
</html>
