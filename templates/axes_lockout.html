{% load i18n %}
<!DOCTYPE html>
<html lang="{{ LANGUAGE_CODE }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% trans "Hisob bloklandi" %} | Online Kutibxona</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0b0e14;
            color: #e2e8f0;
            display: flex; align-items: center; justify-content: center;
            min-height: 100vh; padding: 20px;
        }
        .card {
            background: linear-gradient(135deg, #1a1d27, #12151e);
            border: 1px solid rgba(239,68,68,0.2);
            border-radius: 20px;
            padding: 48px 40px;
            max-width: 440px;
            width: 100%;
            text-align: center;
            box-shadow: 0 0 60px rgba(239,68,68,0.1);
        }
        .icon { font-size: 3rem; color: #ef4444; margin-bottom: 20px; }
        h1 { font-size: 1.3rem; margin-bottom: 12px; }
        p { color: #94a3b8; font-size: 0.9rem; line-height: 1.6; margin-bottom: 24px; }
        a {
            display: inline-block;
            padding: 12px 28px;
            background: #ef4444;
            color: white;
            text-decoration: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.85rem;
            transition: 0.3s;
        }
        a:hover { background: #dc2626; transform: translateY(-2px); }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon"><i class="fas fa-lock"></i></div>
        <h1>{% trans "Hisobingiz vaqtincha bloklandi" %}</h1>
        <p>{% trans "Ko'p marta noto'g'ri urinishlar tufayli hisobingiz 1 soatga bloklangan. Iltimos, birozdan so'ng qayta urinib ko'ring." %}</p>
        <a href="{% url 'login' %}"><i class="fas fa-arrow-left"></i> {% trans "Orqaga qaytish" %}</a>
    </div>
</body>
</html>
