{% load static %}
{% load i18n %}
{% get_current_language as LANGUAGE_CODE %}
<!DOCTYPE html>
<html lang="{{ LANGUAGE_CODE }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>400 - {% trans "Noto'g'ri so'rov" %}</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}?v=20260806">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="overflow-hidden">
    <div class="error-viewport">
        <div class="error-bg-layer"></div>
        <div class="bg-orb bg-orb-1" style="background: linear-gradient(135deg, #f59e0b, #ef4444);"></div>
        <div class="bg-orb bg-orb-2"></div>
        <div class="error-overlay"></div>
        <div class="error-watermark">400</div>
        <canvas id="errorCanvas" class="dynamic-canvas"></canvas>

        <button class="pos-fixed bg-hover border text-muted rounded-md cursor-pointer d-flex flex-center transition shadow-sm" onclick="cycleTheme()" style="top: 20px; right: 20px; z-index: 999; width: 45px; height: 45px; backdrop-filter: blur(14px); border-radius: 14px;">
            <i id="themeIcon" class="fas fa-moon"></i>
        </button>

        <div class="error-card-premium text-center">
            <div class="error-icon-badge">
                <i class="fas fa-times-circle text-danger"></i>
            </div>
            <h1 class="gradient-text text-3xl mb-md">400</h1>
            <h2 class="text-xl mb-md font-weight-bold">{% trans "Noto'g'ri so'rov yuborildi" %}</h2>
            <p class="text-muted text-sm mb-2xl lh-normal">{% trans "Sizning so'rovingizda xatolik mavjud yoki tizim uni qabul qila olmadi." %}</p>
            <a href="/" class="btn-primary text-decoration-none d-inline-flex align-center gap-2 py-md px-2xl font-weight-bold shadow-sm" style="border-radius: 12px;">
                <i class="fas fa-home"></i> {% trans "Bosh sahifaga qaytish" %}
            </a>
        </div>
    </div>

    <script>
        function cycleTheme() {
            const html = document.documentElement;
            const current = html.getAttribute('data-theme') || 'dark';
            const themes = ['dark', 'light'];
            const idx = themes.indexOf(current);
            const next = themes[(idx + 1) % themes.length];
            html.setAttribute('data-theme', next);
            localStorage.setItem('theme', next);
            updateThemeIcon();
        }

        function updateThemeIcon() {
            const icon = document.getElementById('themeIcon');
            if (!icon) return;
            const theme = document.documentElement.getAttribute('data-theme') || 'dark';
            const icons = { 'dark': 'fa-moon', 'light': 'fa-sun' };
            icon.className = 'fas ' + (icons[theme] || 'fa-moon');
        }

        (function() {
            const saved = localStorage.getItem('theme');
            const themes = ['dark', 'light'];
            if (saved && themes.includes(saved)) {
                document.documentElement.setAttribute('data-theme', saved);
            } else {
                const prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches;
                document.documentElement.setAttribute('data-theme', prefersLight ? 'light' : 'dark');
            }
            updateThemeIcon();
        })();

        (function() {
            const canvas = document.getElementById('errorCanvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            let width, height, particles = [];

            function resize() {
                width = canvas.width = window.innerWidth;
                height = canvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resize);
            resize();

            for (let i = 0; i < 30; i++) {
                particles.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    size: Math.random() * 3 + 1,
                    speedY: -Math.random() * 0.4 - 0.1,
                    opacity: Math.random() * 0.5 + 0.1
                });
            }

            function animate() {
                ctx.clearRect(0, 0, width, height);
                particles.forEach(p => {
                    p.y += p.speedY;
                    if (p.y < -10) { p.y = height + 10; p.x = Math.random() * width; }
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fillStyle = '#ef4444';
                    ctx.globalAlpha = p.opacity;
                    ctx.fill();
                });
                requestAnimationFrame(animate);
            }
            animate();
        })();
    </script>
</body>
</html>
