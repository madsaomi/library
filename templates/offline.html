{% load i18n %}
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% trans "Oflayn" %} — {% trans "Online Kutubxona" %}</title>
    <style>
        body { margin: 0; padding: 40px 20px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #1c1917; color: #fef3c7; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 80vh; text-align: center; }
        .icon { font-size: 64px; margin-bottom: 20px; }
        h1 { font-size: 24px; margin: 0 0 10px; color: #d97706; }
        p { font-size: 16px; color: #d6d3d1; max-width: 400px; line-height: 1.5; }
        a { color: #d97706; text-decoration: none; margin-top: 24px; display: inline-block; padding: 12px 24px; border: 1px solid rgba(217,119,6,0.3); border-radius: 12px; transition: all 0.3s; }
        a:hover { background: rgba(217,119,6,0.1); border-color: #d97706; }
    </style>
</head>
<body>
    <div class="icon">📚</div>
    <h1>{% trans "Internet aloqasi yo'q" %}</h1>
    <p>{% trans "Siz hozirda oflayn rejimida. Iltimos, internet aloqasini tekshiring va qayta urinib ko'ring." %}</p>
    <a href="/" onclick="event.preventDefault(); location.reload();">{% trans "Qayta urinish" %}</a>
</body>
</html>
