{% load static %}{% load i18n %}<!DOCTYPE html>
<html lang="{{ LANGUAGE_CODE }}">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% trans "Parolni tiklash | Online Kutubxona" %}</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}?v=1.6">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>.auth-container{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#000;position:relative;overflow:hidden;padding:20px}.auth-bg{position:absolute;width:120%;height:120%;top:-10%;left:-10%;background:url('https://images.unsplash.com/photo-1507842217343-583bb7270b66?q=80&w=2070&auto=format&fit=crop') center/cover no-repeat;filter:brightness(0.4) saturate(1.2)}.auth-overlay{position:absolute;inset:0;background:linear-gradient(135deg,rgba(0,0,0,0.85),rgba(0,0,0,0.6))}.auth-card{position:relative;z-index:1;width:100%;max-width:400px;background:var(--glass);backdrop-filter:blur(20px);border:1px solid var(--border);border-radius:24px;padding:40px;box-shadow:0 25px 60px rgba(0,0,0,0.5)}</style>
</head>
<body>
    <div class="auth-container"><div class="auth-bg"></div><div class="auth-overlay"></div>
        <div class="auth-card">
            <div style="text-align:center;margin-bottom:30px;">
                <h1 class="gradient-text" style="font-size:1.8rem;margin-bottom:8px;">{% trans "Parolni tiklash" %}</h1>
                <p style="color:var(--text-muted);font-size:0.85rem;">{% trans "Email manzilingizni kiriting, biz sizga tiklash havolasini yuboramiz" %}</p>
            </div>
            <form method="post">{% csrf_token %}
                <div class="form-group">
                    <label for="id_email">{% trans "Email" %}</label>
                    <input type="email" name="email" id="id_email" class="form-control" required>
                </div>
                <button type="submit" class="btn-primary" style="width:100%;margin-top:10px;">{% trans "Yuborish" %} <i class="fas fa-paper-plane" style="margin-left:8px;"></i></button>
            </form>
            <div style="text-align:center;margin-top:20px;">
                <a href="{% url 'login' %}" style="color:var(--primary);font-size:0.85rem;text-decoration:none;"><i class="fas fa-arrow-left"></i> {% trans "Kirish sahifasiga qaytish" %}</a>
            </div>
        </div>
    </div>
</body>
</html>
