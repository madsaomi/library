{% load static %}{% load i18n %}
<!DOCTYPE html>
<html lang="{{ LANGUAGE_CODE }}">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% trans "Parolni tiklash | Online Kutubxona" %}</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-bg-layer"></div>
        <div class="bg-orb bg-orb-1"></div>
        <div class="bg-orb bg-orb-2"></div>
        <div class="auth-overlay"></div>
        <div class="auth-card-premium">
            <div class="text-center mb-2xl">
                <div class="d-inline-flex flex-center rounded-xl mb-md p-sm" style="width: 56px; height: 56px; background: var(--glass-strong); border: 1px solid var(--border);">
                    <i class="fas fa-key text-primary" style="font-size: 1.8rem;"></i>
                </div>
                <h1 class="gradient-text text-2xl mb-sm">{% trans "Parolni tiklash" %}</h1>
                <p class="text-muted text-sm">{% trans "Email manzilingizni kiriting, biz sizga tiklash havolasini yuboramiz" %}</p>
            </div>
            <form method="post">{% csrf_token %}
                <div class="form-group mb-xl">
                    <label for="id_email" class="text-muted text-sm mb-xs d-block">{% trans "Email" %}</label>
                    <div class="pos-relative">
                        <input type="email" name="email" id="id_email" class="form-control" required style="padding-left: 42px;">
                        <i class="fas fa-envelope pos-absolute text-muted" style="left: 14px; top: 50%; transform: translateY(-50%); opacity: 0.6;"></i>
                    </div>
                </div>
                <button type="submit" class="btn-primary w-full py-md font-weight-bold transition shadow-sm" style="border-radius: 12px;">{% trans "Yuborish" %} <i class="fas fa-paper-plane ml-xs"></i></button>
            </form>
            <div class="text-center mt-xl">
                <a href="{% url 'login' %}" class="text-primary text-sm text-decoration-none d-inline-flex align-center gap-2"><i class="fas fa-arrow-left"></i> {% trans "Kirish sahifasiga qaytish" %}</a>
            </div>
        </div>
    </div>
</body>
</html>
