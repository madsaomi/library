[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "core.settings"
pythonpath = [".", "apps"]
python_files = ["tests.py", "test_*.py"]
testpaths = ["apps", "accounts", "api", "books", "core", "schools", "stats"]
markers = ["e2e: End-to-end Playwright tests"]

[tool."pytest-playwright"]
browser_type = "chromium"
channel = ""
headless = true
viewport = {width = 1280, height = 720}

[tool.coverage.run]
source = ["."]
omit = ["*/migrations/*", "*/tests.py", "core/wsgi.py", "manage.py", "start.sh"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 0

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E402", "E501"]

[tool.ruff.lint.per-file-ignores]
"*/migrations/*" = ["ALL"]
"api/tests.py" = ["ALL"]
"conftest.py" = ["ALL"]
"debug_*.py" = ["ALL"]
"frontend/views/*.py" = ["E501", "W293"]
"e2e/*" = ["I001"]

[tool.ruff.format]
quote-style = "single"
