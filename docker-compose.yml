services:
  db:
    image: postgres:16-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: kutubxona
      POSTGRES_USER: kutubxona
      POSTGRES_PASSWORD: kutubxona
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kutubxona"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://kutubxona:kutubxona@db:5432/kutubxona
      SECRET_KEY: dev-secret-key-change-in-production
      DEBUG: "True"
      DJANGO_SETTINGS_MODULE: core.settings
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py runserver 0.0.0.0:8000"

volumes:
  postgres_data:
  static_volume:
